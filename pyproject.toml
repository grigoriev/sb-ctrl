[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sb-pull"
version = "0.1.0"
description = "Seedbox to Plex pull agent: rTorrent + TMDb + lftp transfers, driven over SSH."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sergey Grigoriev", email = "grigoriev@fastmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mypy==2.3.0",
    "ruff==0.16.1",
]

[project.urls]
Homepage = "https://github.com/grigoriev/sb-pull"
Repository = "https://github.com/grigoriev/sb-pull"
Issues = "https://github.com/grigoriev/sb-pull/issues"

[project.scripts]
sb-pull = "sb_pull.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sb_pull"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["sb_pull"]

[tool.uv]
required-version = ">=0.5.0"

[tool.coverage.run]
source = ["sb_pull"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
show_error_codes = true
