name: Publish image

# bump-version.yml pushes the v* tag. The image and the GitHub release follow
# from it; no release is created by hand.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The notes come from the CHANGELOG.md section that bump-version.yml cut.
      # A tag without that section fails here, before the image is pushed.
      - name: Read the release notes from CHANGELOG.md
        run: .github/scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/grigoriev/sb-ctrl
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The SBOM lists the packages of the pushed image. It is attached to
      # the image digest as a signed attestation.
      - name: Generate the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/grigoriev/sb-ctrl@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/grigoriev/sb-ctrl
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      # Signs which workflow built the image, from which commit. Users check
      # it with: gh attestation verify oci://<image> --owner grigoriev
      - name: Attest the build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/grigoriev/sb-ctrl
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Scorecard Signed-Releases reads release assets only. The next job
      # creates the release with the signed provenance and the SBOM.
      - name: Collect the release assets
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          mkdir -p assets
          cp "$BUNDLE" assets/provenance.intoto.jsonl
          cp sbom.spdx.json assets/sbom.spdx.json
          cp "$RUNNER_TEMP/release-notes.md" assets/release-notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error
          retention-days: 1

  # A separate job, so only the release holds contents: write.
  release-assets:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: assets

      - name: Create the release with the provenance and the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mv assets/provenance.intoto.jsonl "assets/sb-ctrl-${TAG}.intoto.jsonl"
          mv assets/sbom.spdx.json "assets/sb-ctrl-${TAG}.spdx.json"
          # A rerun replaces the files of the existing release.
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" "assets/sb-ctrl-${TAG}.intoto.jsonl" \
              "assets/sb-ctrl-${TAG}.spdx.json" --clobber --repo "$REPO"
          else
            gh release create "$TAG" "assets/sb-ctrl-${TAG}.intoto.jsonl" \
              "assets/sb-ctrl-${TAG}.spdx.json" --notes-file assets/release-notes.md --repo "$REPO"
          fi
