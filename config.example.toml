# sb-ctrl configuration. Copy to ~/.config/sb-ctrl/config.toml and chmod 600.
# All logic and secrets live here; no client stores any of it.

staging_root = "/data/.staging"   # MUST be on the same filesystem as the library roots

[rtorrent]
url  = "https://sb.mim.box.ca/xmlrpc"
user = "CHANGE_ME"
pass = "CHANGE_ME"

[sftp]
host = "sb.g7v.io"
base = "files"                    # remote dir that rTorrent base paths live under

[tmdb]
key  = "CHANGE_ME"
lang = "en-US"

[roots]
movies         = "/data/media/movies"
cartoons       = "/data/media/cartoons"
series         = "/data/media/series"
cartoon_series = "/data/media/cartoon-series"

[perms]
owner     = "plex"
group     = "plex"
dir_mode  = 775
file_mode = 664

[layout]
movie = "folder"                  # "folder" (per-title dir) or "flat"

[files]
# Recognized media extensions and junk skip patterns for season-pack layout.
video_ext     = [".mkv", ".mp4", ".avi", ".m4v", ".mov", ".ts"]
sub_ext       = [".srt", ".ass", ".sub"]
skip_patterns = ["sample"]        # case-insensitive substrings; matches skip the file

[lftp]
limit_rate = ""                   # e.g. "2M" to cap bandwidth; empty = unlimited
parallel   = 1

[auth]
# Browser login. Generate both values with:  sb-ctrl hash-password
# Leave the section out and the browser gets no way in of its own; then the API
# is open to whatever can reach it, or to holders of the [api] token.
user          = "CHANGE_ME"
password_hash = "CHANGE_ME"        # scrypt$salt$hash
secret        = "CHANGE_ME"        # signs the session cookie
ttl_hours     = 720                # how long a session lasts

[api]
host  = "127.0.0.1"               # behind a systemd reverse proxy; use "0.0.0.0" in Docker
port  = 8765
token = "CHANGE_ME"               # bearer token clients must send
